services:
  - type: web
    runtime: docker
    name: gps-tracking-api
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gps-tracking-db
          property: connectionString
      - key: PROTRACK_ACCOUNT
        sync: false
      - key: PROTRACK_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: gps-tracking-dashboard
    rootDir: frontend/nuxt-app
    buildCommand: npm ci && npm run generate
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NUXT_PUBLIC_API_BASE
        sync: false

databases:
  - name: gps-tracking-db
    plan: free
    databaseName: gps_tracking
    user: gps_tracking
